name: Bug Report
description: Report a problem with pseudo-jsc
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please collect logs from `~/Library/Logs/pseudo.log` (or `/var/log/pseudo.log` if you're running outside Jamf Setup Checklist).

        For UI automation issues, confirm the `PPPC - Jamf Setup Checklist.mobileconfig` profile is deployed and your code-signing OIDs / subject.OU values are correct.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
      placeholder: When the user clicks "Register for PSSO", the System Settings window opens but...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enroll a Mac into Jamf with the JSC profile deployed
        2. Log in as a fresh user
        3. Click "Register for PSSO"
        4. ...
    validations:
      required: true

  - type: dropdown
    id: macos
    attributes:
      label: macOS version
      options:
        - macOS 15 Sequoia
        - macOS 16 Tahoe
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: auth-method
    attributes:
      label: Platform SSO authentication method
      options:
        - SmartCard / PIV
        - Secure Enclave
        - Password
        - Not sure (please paste your PSSO config profile content)
    validations:
      required: true

  - type: dropdown
    id: idp
    attributes:
      label: Identity provider
      options:
        - Microsoft Entra (Company Portal)
        - Okta (Okta Verify)
        - Other (specify in additional context)
    validations:
      required: true

  - type: input
    id: jsc
    attributes:
      label: Jamf Setup Checklist version
      placeholder: e.g. 1.4.0

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Deployment prerequisites
      options:
        - label: PPPC configuration profile from `HelperConfigProfiles/` is deployed to the device
          required: true
        - label: Platform SSO configuration profile is deployed to the device
          required: true
        - label: Company Portal or Okta Verify is installed in `/Applications/`
          required: true

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Relevant section from `~/Library/Logs/pseudo.log`. Please scrub any sensitive identifiers (user names, computer names, tenant IDs) before pasting.
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — Jamf policy IDs, custom config knob values, related configuration profiles.
